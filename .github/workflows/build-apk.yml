name: Build Kidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.kidu --project-name kidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Ensure app level build.gradle targets Java 17 & JVM 17
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: |
          # 1. Update all plugins in pub-cache to Java 17
          find /home/runner/.pub-cache -name "build.gradle" | while read -r file; do
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$file"
          done

          # 2. Patch on_audio_query namespace and kotlinOptions
          find /home/runner/.pub-cache -name "build.gradle" -path "*on_audio_query_android*" | while read -r file; do
            if ! grep -q "namespace" "$file"; then
              sed -i 's/android {/android {\n    namespace "com.lucasjosino.on_audio_query"/' "$file"
              echo "[OK] Patched namespace in $file"
            fi
            if ! grep -q "kotlinOptions" "$file"; then
              sed -i '/compileOptions {/i \ \ \ \ kotlinOptions {\n        jvmTarget = "17"\n    }' "$file"
              echo "[OK] Added kotlinOptions to $file"
            else
              sed -i "s/jvmTarget = '[^']*'/jvmTarget = '17'/g" "$file"
            fi
          done

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/kidu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidu-apk
          path: build-output/kidu.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.sha }}
          name: Kidu Release v1.0.0 (Flutter Native APK)
          make_latest: true
          body: |
            ## Kidu - Local Music Player with Hardware Equalizer
            - Apple Music UI Aesthetic with OLED dark mode & dynamic album gradient blur
            - 10-Band Hardware Equalizer + Presets
            - Local library query with permissions for Android 13+ and legacy storage
            - Background playback notification & lock screen controls
            - Download `kidu.apk` di bawah dan pasang langsung di HP Android.
          files: build-output/kidu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
