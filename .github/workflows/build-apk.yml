name: Build Qidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.qidu --project-name qidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Inject Qidu logo into Android launcher mipmap icons
          for dir in android/app/src/main/res/mipmap-*; do
            cp assets/icon/logo.png "$dir/ic_launcher.png"
            cp assets/icon/logo.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "[OK] Injected official Qidu icon into Android launcher mipmaps"

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: python3 scripts/patch_gradle.py

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu-1.3.apk
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-1.3-apk
          path: build-output/qidu-1.3.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-${{ github.sha }}
          name: Qidu 1.3 (Apple Music Polish - Lyrics, Queue, Library & Tag Editor)
          make_latest: true
          body: |
            ## Qidu 1.3 - Complete Apple Music Studio Offline Experience
            - **📜 Lirik Lagu Terintegrasi (.lrc)**: Tampilan lirik bergaya karaoke Apple Music dengan auto-scroll dan penanda waktu aktif. Dukungan file `.lrc` lokal dan input lirik manual.
            - **📑 Antrean Putar (Up Next Queue)**: Kelola daftar lagu yang sedang dan akan diputar, bisa atur ulang urutan (*reorder drag-and-drop*) atau hapus lagu dari antrean.
            - **🎨 Animasi Cover Membal & Volume Slider**: Cover album membal (*spring bounce*) saat play/pause dan kontrol volume langsung di layar pemutar.
            - **❤️ Sistem Lagu Favorit**: Tandai lagu favorit dengan ikon hati dan temukan di tab khusus Favorit.
            - **🗂️ Kategori Perpustakaan Lengkap**: Navigasi pil Apple Music untuk memfilter lagu berdasarkan Semua Lagu, Favorit, Artis, dan Album Grid.
            - **✏️ Tag / Metadata Editor**: Ubah judul lagu, artis, dan album langsung dari aplikasi agar koleksi MP3 Anda tetap rapi.
            - **⚡ Instant 5-Band Equalizer & Studio Lossless**: Presets audio studio dan pemutaran lossless bit-perfect tetap siap dinikmati.
            
            Unduh file `qidu-1.3.apk` (atau `qidu.apk`) di bawah dan pasang di HP Android kamu.
          files: |
            build-output/qidu-1.3.apk
            build-output/qidu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
