name: Build Qidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.qidu --project-name qidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: python3 scripts/patch_gradle.py

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-apk
          path: build-output/qidu.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-${{ github.sha }}
          name: Qidu Release v1.1.0 (Studio Lossless APK)
          make_latest: true
          body: |
            ## Qidu - Studio Offline Audio Player with Hardware Equalizer
            - **Lossless & Hi-Res Lossless Audio**: Bit-for-bit studio audio resolution up to 24-bit/192 kHz (FLAC, ALAC, WAV).
            - **Sound Check & Crossfade**: Intelligent volume normalization and smooth transitions between songs.
            - **Playback Controls**: Full Shuffle, Loop (All/One/Off), and Sleep Timer with End-of-Track auto stop.
            - **Local Audio Management**: Delete audio files permanently with safety confirmation.
            - **10-Band Graphic Equalizer**: Hardware DSP audio effects with custom and tuned presets.
            - Download `qidu.apk` di bawah dan pasang langsung di HP Android.
          files: build-output/qidu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
