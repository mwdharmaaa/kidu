name: Build Qidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.qidu --project-name qidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Inject Qidu logo into Android launcher mipmap icons
          for dir in android/app/src/main/res/mipmap-*; do
            cp assets/icon/logo.png "$dir/ic_launcher.png"
            cp assets/icon/logo.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "[OK] Injected official Qidu icon into Android launcher mipmaps"

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: python3 scripts/patch_gradle.py

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu-1.3.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-1.3.2-apk
          path: build-output/qidu-1.3.2.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: Qidu 1.3.2 - Pemutar Musik Apple Music Studio
          make_latest: true
          body: |
            ## Qidu 1.3.2 - Pemutar Musik Apple Music Studio

            Pembaruan Qidu versi 1.3.2 dengan perbaikan tombol kontrol bilah notifikasi media latar belakang, ikon kontrol mode putar terpadu (Berurutan, Loop 1 Lagu, dan Acak), dan stabilitas pemutaran audio.

            ### Pembaruan dan Fitur Utama:
            - Tombol Pemutaran Terpadu (Berurutan, Loop 1 Lagu, Acak):
              - Ikon Mode Berurutan: Ikon loop berputar standar (memutar antrean lagu berurutan).
              - Ikon Mode Loop: Ikon loop berputar dengan angka satu kecil di tengahnya (mengulang 1 lagu aktif).
              - Ikon Mode Acak: Ikon panah bersilang (memutar lagu secara acak/shuffle).
              - Siklus 1 tombol: Berurutan -> Loop (Ulang 1 Lagu) -> Acak (Shuffle) -> Berurutan.
            - Bilah Notifikasi Media Latar Belakang Responsif:
              - Perbaikan integrasi MediaSession Compat dan MediaButtonReceiver pada bilah notifikasi atas.
              - Tombol mode putar pada bilah notifikasi kini responsif saat ditekan langsung dari panel notifikasi sistem dan Quick Settings.
              - Tombol Sebelumnya, Putar/Jeda, dan Berikutnya aktif penuh dengan sinkronisasi visual sampul album dan metadata lagu.
            - Lirik Lagu Terintegrasi (.lrc):
              - Sinkronisasi lirik bergaya karaoke Apple Music dengan auto-scroll dan penanda waktu aktif.
            - Antrean Putar (Up Next Queue):
              - Pengaturan urutan antrean putar dengan drag-and-drop dan tombol kontrol mode putar terpadu di lembar antrean.
            - Manajemen Perpustakaan Musik:
              - Filter lagu berdasarkan Semua Lagu, Favorit, Artis, dan Album Grid.
              - Editor metadata lagu (judul, artis, album) langsung dari aplikasi.
              - Hapus berkas audio dengan izin penyimpanan Android.

            Unduh berkas qidu-1.3.2.apk di bawah untuk memasang pembaruan ini di perangkat Android Anda.
          files: |
            build-output/qidu-1.3.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
