name: Build Qidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.qidu --project-name qidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Inject Qidu logo into Android launcher mipmap icons
          for dir in android/app/src/main/res/mipmap-*; do
            cp assets/icon/logo.png "$dir/ic_launcher.png"
            cp assets/icon/logo.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "[OK] Injected official Qidu icon into Android launcher mipmaps"

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: python3 scripts/patch_gradle.py

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu-1.2.apk
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-1.2-apk
          path: build-output/qidu-1.2.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-${{ github.sha }}
          name: Qidu 1.2 (Instant Equalizer & Studio Lossless)
          make_latest: true
          body: |
            ## Qidu 1.2 - Studio Offline Audio Player
            - **⚡ Instant Equalizer**: Diperbaiki total! Menu Equalizer kini terbuka seketika (0 ms) tanpa loading dan slider merespons secara real-time.
            - **🏷️ Versi Jelas**: Nama aplikasi di layar Android kini berlabel **Qidu 1.2** agar mudah membedakan versi terbaru.
            - **🎵 Lossless & Hi-Res Lossless**: Resolusi hingga 24-bit/192 kHz dengan badge format audio interaktif.
            - **⚙️ Pengaturan Lengkap**: Sound Check (Normalisasi Volume), Crossfade (1-12s), Gapless Playback, dan Sleep Timer.
            - **🔀 Kontrol Penuh**: Shuffle, Loop Mode, dan Hapus Berkas Audio dari memori dengan konfirmasi aman.
            - **🎨 Ikon Resmi**: Ikon minimalis resmi Qidu terpasang di launcher Android.
            
            Unduh file `qidu-1.2.apk` (atau `qidu.apk`) di bawah dan pasang di HP Android kamu.
          files: |
            build-output/qidu-1.2.apk
            build-output/qidu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
