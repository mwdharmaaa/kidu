name: Build Qidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.qidu --project-name qidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Inject Qidu logo into Android launcher mipmap icons
          for dir in android/app/src/main/res/mipmap-*; do
            cp assets/icon/logo.png "$dir/ic_launcher.png"
            cp assets/icon/logo.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done
          echo "[OK] Injected official Qidu icon into Android launcher mipmaps"

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: python3 scripts/patch_gradle.py

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/qidu-1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-1.3-apk
          path: build-output/qidu-1.3.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Qidu 1.3 - Pemutar Musik Apple Music Studio
          make_latest: true
          body: |
            ## Qidu 1.3 - Pemutar Musik Apple Music Studio

            Pembaruan Qidu versi 1.3 dengan fitur kontrol urutan putar lengkap, bilah notifikasi media latar belakang, dan pengoptimalan performa audio.

            ### Pembaruan dan Fitur Utama:
            - Kontrol Pemutaran Lengkap:
              - Dukungan mode Acak (Shuffle) untuk memutar lagu secara acak.
              - Dukungan mode Ulang Semua (Loop All) untuk memutar ulang seluruh daftar lagu secara terus-menerus.
              - Dukungan mode Ulang Satu (Loop One) untuk mengulang lagu yang sedang diputar.
              - Dukungan mode Berurutan (Sequential) untuk memutar lagu sesuai urutan daftar hingga selesai.
              - Tombol Sebelumnya (Previous) dan Berikutnya (Next) selalu aktif dan responsif.
              - Tombol Stop pada bilah notifikasi telah dinonaktifkan agar tidak mengganggu navigasi.
            - Bilah Notifikasi Media Latar Belakang:
              - Integrasi MediaSession Android dengan tombol aksi kustom untuk Acak, Ulang, Sebelumnya, Putar/Jeda, dan Berikutnya.
              - Tampilan metadata judul, artis, dan sampul album yang akurat langsung dari memori perangkat.
            - Lirik Lagu Terintegrasi (.lrc):
              - Sinkronisasi lirik bergaya karaoke Apple Music dengan auto-scroll dan penanda waktu aktif.
            - Antrean Putar (Up Next Queue):
              - Pengaturan urutan antrean putar dengan drag-and-drop dan kontrol mode putar langsung dari lembar antrean.
            - Manajemen Perpustakaan Musik:
              - Filter lagu berdasarkan Semua Lagu, Favorit, Artis, dan Album Grid.
              - Editor metadata lagu (judul, artis, album) langsung dari aplikasi.
              - Hapus berkas audio dengan izin penyimpanan Android 11 ke atas.

            Unduh berkas qidu-1.3.apk di bawah untuk memasang pembaruan ini di perangkat Android Anda.
          files: |
            build-output/qidu-1.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
