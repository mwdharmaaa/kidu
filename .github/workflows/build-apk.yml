name: Build Kidu APK

on:
  push:
    branches:
      - main
      - devv
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'distribution'
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project
        run: |
          # Backup custom AndroidManifest with AudioService & Equalizer permissions
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          # Clean scaffold standard Flutter Android build files
          rm -rf android
          flutter create . --org com.kidu --project-name kidu --platforms=android
          # Restore custom AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Ensure app level build.gradle targets Java 17 & JVM 17
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          content = content.replace("jvmTarget = \x271.8\x27", "jvmTarget = \x2717\x27")
          content = content.replace("jvmTarget = \"1.8\"", "jvmTarget = \"17\"")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("[OK] Configured android/app/build.gradle for Java 17")
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch plugins for AGP 8 & Java 17
        run: |
          python3 -c '
          import glob

          # 1. Update on_audio_query_android
          for path in glob.glob("/home/runner/.pub-cache/hosted/pub.dev/on_audio_query_android-*/android/build.gradle"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              if "namespace" not in content:
                  patch = """android {
      namespace "com.lucasjosino.on_audio_query"
      compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
      }
      kotlinOptions {
          jvmTarget = "17"
      }"""
                  content = content.replace("android {", patch, 1)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"[OK] Successfully patched on_audio_query at {path}")

          # 2. Update any other plugins with JavaVersion.VERSION_1_8 to 17
          for path in glob.glob("/home/runner/.pub-cache/hosted/pub.dev/*/android/build.gradle"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "JavaVersion.VERSION_1_8" in content:
                  content = content.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"[OK] Upgraded Java version to 17 in {path}")
          '

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Output
        run: |
          mkdir -p build-output
          cp build/app/outputs/flutter-apk/app-release.apk build-output/kidu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidu-apk
          path: build-output/kidu.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.sha }}
          name: Kidu Release v1.0.0 (Flutter Native APK)
          make_latest: true
          body: |
            ## Kidu - Local Music Player with Hardware Equalizer
            - Apple Music UI Aesthetic with OLED dark mode & dynamic album gradient blur
            - 10-Band Hardware Equalizer + Presets
            - Local library query with permissions for Android 13+ and legacy storage
            - Background playback notification & lock screen controls
            - Download `kidu.apk` di bawah dan pasang langsung di HP Android.
          files: build-output/kidu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
