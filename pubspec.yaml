name: music_player_app
description: "Apple Music styled local audio player with hardware Equalizer for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  palette_generator: ^0.3.3+4
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
